<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>TD&amp;I Crew Contacts</title>
<style>
  :root{
    --black:#000;
    --card:#161616;
    --line:#2c2c2c;
    --white:#fff;
    --muted:#a9a9a9;
    --lead:#F26522;      /* leaders: TD&I orange (from logo) */
    --alert:#E5232F;     /* injury banner */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--black);color:var(--white);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{padding:0 0 calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  header{padding:22px 14px 14px;text-align:center;border-bottom:3px solid var(--lead);background:#000}
  .brand{font-size:40px;font-weight:900;letter-spacing:.04em;line-height:1}
  .brand span{color:var(--lead)}
  .sub{margin-top:6px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .hint{margin:14px 0 0;text-align:center;color:var(--muted);font-size:14px}

  .injury{margin:16px 0 0;background:var(--alert);border-radius:14px;padding:14px 16px;text-align:center}
  .injury h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.06em;line-height:1.05}
  .injury p{margin:6px 0 0;font-size:17px;font-weight:700;line-height:1.25}

  .jobinjury{margin:10px 0 0;background:#B81D26;border-radius:14px;padding:12px 12px 10px;text-align:center}
  .jobinjury h3{margin:0 0 10px;font-size:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
  .jobinjury .person{margin-bottom:8px}
  .jobinjury .person:last-child{margin-bottom:0}
  .jobinjury .call,.jobinjury .txt{background:#fff;border-color:#fff;color:#000}
  .jobinjury .role{color:#444}
  .jobinjury .call:active,.jobinjury .txt:active{background:#e6e6e6}
  .jobinjury .who{text-align:left}

  h2{margin:24px 2px 10px;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h2.lead{color:var(--lead)}

  .person{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
  .call{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;min-height:60px}
  .call:active{transform:scale(.99);background:#222}
  .who{min-width:0}
  .name{font-size:17px;font-weight:800;line-height:1.15}
  .role{font-size:13px;color:var(--muted);margin-top:2px;font-weight:600}
  .num{font-size:16px;font-weight:800;white-space:nowrap;letter-spacing:0}
  .txt{display:flex;align-items:center;justify-content:center;width:52px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--white);
    font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .txt:active{background:#222}

  /* Leaders: contrasting colour */
  .leader .call{background:var(--lead);border-color:var(--lead);color:#000}
  .leader .call:active{background:#d9551a}
  .leader .role{color:#1f0b00}
  .leader .txt{background:var(--lead);border-color:var(--lead);color:#000}

  footer{margin-top:22px;text-align:center;color:#6f6f6f;font-size:12px}
  @media (max-width:360px){
    .brand{font-size:34px}.name{font-size:16px}.num{font-size:15px}.txt{width:46px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">TD<span>&amp;</span>I</div>
  <div class="sub">Crew Contacts</div>
</header>

<main class="wrap">
  <section class="injury">
    <h1>INJURY</h1>
    <p>Immediately contact your leader</p>
  </section>
  <section class="jobinjury">
    <h3>Job injury &middot; Contact point for foreman / supervisor</h3>
    <div id="injurycontacts"></div>
  </section>
  <p class="hint">Tap a name to call &middot; tap TEXT to message</p>

  <h2 class="lead">Leaders</h2>
  <div id="leaders"></div>

  <h2>Crew Members</h2>
  <div id="crew"></div>

  <h2>Office Staff</h2>
  <div id="office"></div>

  <footer>TD&amp;I &middot; Keep this page for internal crew use</footer>
</main>

<script>
(function(){
  var leaders = [
    ["Ted Bales","Manager of MN Operations","320.309.3424"],
    ["Zach Schaefer","Project Supervisor","320.980.2921"],
    ["Alex Schaefer","Foreman","320.492.3430"],
    ["Alex Tray","Foreman","320.249.5897"],
    ["Scott Saudinatits","Foreman","320.333.6431"]
  ];
  var crew = [
    ["Chaz Norlund","320.380.3224"],
    ["Jacob Stevens","763.220.9231"],
    ["Nate Goff","320.330.9161"],
    ["Levi Lauer","320.406.4415"],
    ["Kyle Anderson","320.405.6373"],
    ["Austin Ludwig","320.979.7887"],
    ["Devin Ruch","320.895.9917"],
    ["Brian Teubert","320.552.2324"],
    ["Ayden Gough","320.442.9965"],
    ["Nolan Flaten","320.423.7500"],
    ["Katie Skepper","763.398.9497"],
    ["Jackson Leitch","320.682.2085"],
    ["Karson Gariepy","651.332.1386"],
    ["Ryan Irving","320.428.8294"]
  ];
  var office = [
    ["Jennifer Schaefer","Office Admin","320.250.8812"],
    ["Ariel Juetten","Rev. Operations","715.245.1139"]
  ];

  var injury = [
    ["Steve Peterson","Safety Director","651.767.2373"],
    ["Work Partners","","800.359.5020"]
  ];

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function digits(n){return n.replace(/\D/g,"")}
  function row(name, role, phone, cls){
    var d = digits(phone);
    return '<div class="person '+(cls||"")+'">' +
      '<a class="call" href="tel:+1'+d+'">' +
        '<div class="who"><div class="name">'+esc(name)+'</div>' +
        (role ? '<div class="role">'+esc(role)+'</div>' : '') + '</div>' +
        '<div class="num">'+esc(phone)+'</div>' +
      '</a>' +
      '<a class="txt" href="sms:+1'+d+'" aria-label="Text '+esc(name)+'">Text</a>' +
    '</div>';
  }
  document.getElementById("injurycontacts").innerHTML =
    injury.map(function(p){return row(p[0],p[1],p[2])}).join("");
  document.getElementById("leaders").innerHTML =
    leaders.map(function(p){return row(p[0],p[1],p[2],"leader")}).join("");
  document.getElementById("crew").innerHTML =
    crew.map(function(p){return row(p[0],"",p[1])}).join("");
  document.getElementById("office").innerHTML =
    office.map(function(p){return row(p[0],p[1],p[2])}).join("");
})();
</script>
</body>
</html>
